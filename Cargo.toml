[package]
name = "desk-monitoring"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Jakob Lyse <jakob.lyse@gmail.com>"]
description = "Conky-style transparent desktop monitor built with Rust and GTK4"
repository = "https://github.com/nordlyse/DeskMonitoring"
readme = "README.md"

[package.metadata.deb]
maintainer = "Jakob Lyse <jakob.lyse@gmail.com>"
copyright = "2026 Jakob Lyse"
extended-description = """Conky-style transparent desktop monitor with live CPU, memory, disk, network, mail, calendar, and weather charts."""
section = "utils"
priority = "optional"
depends = "$auto"
assets = [
    ["target/release/desk-monitoring", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/desk-monitoring/", "644"],
    ["LICENSE", "usr/share/doc/desk-monitoring/", "644"],
    ["packaging/desk-monitoring.desktop", "usr/share/applications/", "644"],
    ["packaging/desk-monitoring.png", "usr/share/icons/hicolor/512x512/apps/", "644"],
]

[features]
default = []
layer-shell = ["dep:gtk4-layer-shell"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"
glib = "0.20"
gtk = { version = "0.9.6", package = "gtk4", features = ["v4_10"] }
icalendar = "0.16"
native-tls = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.32"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "time", "macros", "net", "io-util"] }
tokio-native-tls = "0.3"
toml = "0.8"

[target.'cfg(target_os = "linux")'.dependencies]
gtk4-layer-shell = { version = "0.5", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
